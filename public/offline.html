<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Gasco Energy ExpenseTracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FCFBF9 0%, #F2EDE7 100%);
      color: #002E22;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 440px;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #03D47C, #00C271);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 24px rgba(3, 212, 124, 0.3);
    }
    .icon svg { width: 40px; height: 40px; color: white; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #76847E; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.2s;
      text-decoration: none;
    }
    .btn:hover { transform: scale(1.02); }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, #03D47C, #00C271);
      color: white;
      box-shadow: 0 4px 12px rgba(3, 212, 124, 0.3);
    }
    .btn-secondary {
      background: white;
      color: #002E22;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .btn svg { width: 18px; height: 18px; }
    .status {
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: #FEF3C7;
      color: #92400E;
      font-size: 0.8rem;
      display: none;
    }
    .status.show { display: block; }
    .pending-count {
      font-weight: 700;
      color: #03D47C;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M12 9v4m0 4h.01" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>No internet connection, but you can still work. Add expenses and they'll sync automatically when you reconnect.</p>

    <div class="actions">
      <a href="/dashboard" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1" />
        </svg>
        Go to Dashboard
      </a>
      <a href="/dashboard/expenses/new" class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        Add Expense Offline
      </a>
      <button class="btn btn-secondary" onclick="window.location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Try Again
      </button>
    </div>

    <div class="status" id="pendingStatus"></div>
  </div>

  <script>
    // Check for queued offline expenses
    (async function() {
      try {
        const cache = await caches.open('offline-expenses');
        const keys = await cache.keys();
        if (keys.length > 0) {
          const el = document.getElementById('pendingStatus');
          el.className = 'status show';
          el.innerHTML = '<span class="pending-count">' + keys.length + '</span> expense' + (keys.length === 1 ? '' : 's') + ' saved offline, waiting to sync.';
        }
      } catch(e) {}
    })();

    // Auto-redirect when back online
    window.addEventListener('online', function() {
      window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
